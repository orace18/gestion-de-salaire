<div class="salary-input-card">
    <div class="card-header">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            class="header-icon">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <h2 class="card-title">Salaire Mensuel</h2>
    </div>

    <div class="input-wrapper">
        <input type="number" class="salary-input" [ngModel]="editingValue" (ngModelChange)="onInput($event)"
            placeholder="Entrez votre salaire" min="0" step="1000">
        <span class="currency">XOF</span>
    </div>

    <div class="amount-display">
        {{ displayAmount | number:'1.0-0' }} XOF
    </div>
</div>
