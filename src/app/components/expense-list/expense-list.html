<div class="expense-list-card">
    <div class="card-header">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            class="header-icon">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
        <h2 class="card-title">Dépenses</h2>
    </div>

    <!-- Add Expense Form -->
    <div class="add-expense-form">
        <div class="form-row">
            <select [(ngModel)]="selectedCategory" class="category-select">
                @for (cat of categories; track cat) {
                <option [value]="cat">{{ cat }}</option>
                }
            </select>

            <div class="amount-input-wrapper">
                <input type="number" [(ngModel)]="amount" placeholder="Montant" class="amount-input" min="0">
                <span class="currency-label">XOF</span>
            </div>
        </div>

        <input type="text" [(ngModel)]="description" placeholder="Description" class="description-input"
            (keydown.enter)="onAddExpense()">

        <button class="add-btn" (click)="onAddExpense()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
            <span>Ajouter</span>
        </button>
    </div>

    <!-- Expenses List -->
    <div class="expenses-container">
        @if (expenses.length === 0) {
        <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                class="empty-icon">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
            </svg>
            <p>Aucune dépense ajoutée</p>
        </div>
        } @else {
        @for (expense of expenses; track expense.id) {
        <div class="expense-item" [class.pending]="expense.isPending">
            <div class="expense-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        [attr.d]="getCategoryIcon(expense.category)" />
                </svg>
            </div>

            <div class="expense-details">
                <div class="expense-description">{{ expense.description }}</div>
                <div class="expense-category">
                    {{ expense.category }}
                    @if (expense.isPending) {
                    <span class="pending-badge">En attente</span>
                    }
                </div>
            </div>

            <div class="expense-amount">{{ expense.amount | number:'1.0-0' }} XOF</div>

            <button class="delete-btn" (click)="onRemoveExpense(expense.id)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </button>
        </div>
        }
        }
    </div>
</div>
